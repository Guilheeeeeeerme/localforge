name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package release installer
        run: |
          mkdir dist
          tag=${GITHUB_REF_NAME}
          archive="localforge-${tag}.tar.gz"
          git archive --format=tar.gz --prefix="localforge-${tag}/" -o "dist/${archive}" "${tag}"
          checksum=$(sha256sum "dist/${archive}" | awk '{print $1}')
          {
            echo '#!/usr/bin/env bash'
            printf 'LOCALFORGE_RELEASE_TAG=%q\n' "$tag"
            printf 'LOCALFORGE_RELEASE_ARCHIVE=%q\n' "https://github.com/Guilheeeeeeerme/localforge/releases/download/${tag}/${archive}"
            printf 'LOCALFORGE_RELEASE_SHA256=%q\n' "$checksum"
            tail -n +2 scripts/install.sh
          } > dist/install.sh
          chmod +x dist/install.sh
          printf '%s  %s\n' "$checksum" "$archive" > dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/install.sh
            dist/localforge-*.tar.gz
            dist/SHA256SUMS
